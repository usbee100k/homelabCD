apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  name: homelab-root

  namespace: argocd


spec:

  project: default


  source:

    repoURL: REPLACE_REPO_URL

    targetRevision: REPLACE_BRANCH

    path: apps/root


  destination:

    server: https://kubernetes.default.svc

    namespace: argocd


  syncPolicy:

    automated:

      prune: true

      selfHeal: true