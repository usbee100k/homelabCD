cluster:
  name: homelab   # shown in KubesTUI; change it any time (or use "Rename Cluster")

kubernetes:
  version: "1.36.2"

network:
  vip: "192.168.50.222" ## Change to your own VIP of choosing
  podSubnet: "10.0.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  dnsDomain: "cluster.local"
  metallbRange: ""

github:
  repo: ""
  branch: "main"

domains:
  base: ""
  acmeEmail: ""

# WireGuard VPN (wg-easy) for reaching the cluster from outside the LAN.
vpn:
  enabled: false
  endpoint: ""     # public name clients connect to, e.g. myhome-vpn.duckdns.org
  port: 51820
  ip: ""           # MetalLB IP for wg-easy (forward UDP port to it on your router)
  allowedIPs: ""   # node subnet(s) VPN clients can reach, e.g. 192.168.50.0/24

features:
  cilium: true
  certManager: true
  longhorn: true
  ingressNginx: true
  metricsServer: true
  metallb: true
  monitoring: true
  grafana: true
  prometheus: true
  loki: true
  tempo: true
  harbor: false
  gitea: false
  authentik: false
  vault: false
  cloudnativepg: true
  minio: true
  ollama: false
  openWebUI: false
  anythingLLM: false