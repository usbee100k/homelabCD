kubeProxyReplacement: true

k8sServiceHost: 192.168.50.222 ## Change to Your VIP 

k8sServicePort: 6443

#CHANGE THIS to 2 WITH: sudo /usr/local/sbin/cilium-operator-scaler.sh   ONCE YOUR 2nd NODE IS
# JOINED, BUT IS AUTOMATICALLY CHECKED WITH cilium-operator-scaler.sh
operator:
  replicas: 1

ipam:
  mode: kubernetes

routingMode: native

autoDirectNodeRoutes: true

ipv4NativeRoutingCIDR: 10.10.0.0/24

endpointRoutes:
  enabled: true

bpf:
  masquerade: true
  hostLegacyRouting: true

rollOutPods: true
