apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - REPLACE_METALLB_RANGE
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
  # Up to 3 Ready nodes carry this label; maintained by
  # the metallb-node-selector timer (lib/metallb.sh).
  nodeSelectors:
    - matchLabels:
        homelab.io/metallb-announce: "true"
