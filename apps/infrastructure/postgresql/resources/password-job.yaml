# Creates the login once (Secret postgresql-auth: username, password,
# database) with a random password, so no password is stored in git.
# Runs on every Argo CD sync and does nothing if the Secret exists.
#
# Read the password:
#   kubectl -n postgresql get secret postgresql-auth -o jsonpath='{.data.password}' | base64 -d; echo
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql-password
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgresql-password
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-password
  namespace: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgresql-password
subjects:
  - kind: ServiceAccount
    name: postgresql-password
    namespace: postgresql
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-password
  namespace: postgresql
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: postgresql-password
      restartPolicy: Never
      containers:
        - name: password
          image: alpine/k8s:1.36.5  # kubectl + sh
          command:
            - /bin/sh
            - -c
            - |
              if kubectl -n postgresql get secret postgresql-auth >/dev/null 2>&1; then
                echo "Secret postgresql-auth already exists; keeping it."
                exit 0
              fi
              pw="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"
              kubectl -n postgresql create secret generic postgresql-auth \
                --from-literal=username=postgres \
                --from-literal=password="${pw}" \
                --from-literal=database=homelab
              echo "Created Secret postgresql-auth."
