# pgAdmin: the web UI for PostgreSQL, at https://postgresql.<domain>
# (subdomain in config/ingress.yaml).
#
# Log in with admin@<domain> and the PostgreSQL password:
#   kubectl -n postgresql get secret postgresql-auth -o jsonpath='{.data.password}' | base64 -d; echo
# The "homelab PostgreSQL" server is already listed; it asks for the same
# password the first time you open it (tick "Save password").
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: postgresql
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "homelab PostgreSQL",
          "Group": "Servers",
          "Host": "postgresql.postgresql.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "homelab",
          "Username": "postgres",
          "SSLMode": "prefer"
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data
  namespace: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: postgresql
spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgadmin

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      securityContext:
        fsGroup: 5050  # the pgadmin user in the image

      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9

          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@REPLACE_BASE_DOMAIN"

            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-auth
                  key: password

            # The login is just a name: don't check that it can get mail.
            - name: PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY
              value: "False"

            - name: PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS
              value: "['local', 'lan', 'home', 'arpa', 'internal']"

            - name: PGADMIN_SERVER_JSON_FILE
              value: /pgadmin4/servers/servers.json

            - name: PGADMIN_LISTEN_PORT
              value: "80"

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/pgadmin

            - name: servers
              mountPath: /pgadmin4/servers
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgadmin-data

        - name: servers
          configMap:
            name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: postgresql
spec:
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
