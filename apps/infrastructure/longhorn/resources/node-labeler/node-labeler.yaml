apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-node-labeler
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-node-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-node-labeler
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-node-labeler
  namespace: longhorn-system
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-node-labeler
          restartPolicy: Never
          containers:
            - name: labeler
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  for node in $(kubectl get nodes -o name); do
                    kubectl label "$node" \
                      node.longhorn.io/create-default-disk=true \
                      --overwrite
                  done
