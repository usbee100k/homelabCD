apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-node-labeler
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-node-labeler
subjects:
  - kind: ServiceAccount
    name: longhorn-node-labeler
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-node-labeler
  namespace: longhorn-system
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-node-labeler
          restartPolicy: Never
          containers:
            - name: labeler
              image: alpine/k8s:1.36.5  # kubectl + sh; keep minor in step with the cluster
              command:
                - /bin/sh
                - -c
                - |
                  # Nodes registered with homelab.io/longhorn-disk=dedicated
                  # (set by the installer's dedicated-disk prompt) store data
                  # on their own disk with nothing reserved. Every other node
                  # uses /var/lib/longhorn on the OS disk, where Longhorn
                  # keeps 30% free for the OS.
                  #
                  # Longhorn only reads this while a node has no disks, so it
                  # never moves storage on a node that already has some.
                  kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels.homelab\.io/longhorn-disk}{"\n"}{end}' |
                  while read -r node disk; do
                    [ -n "$node" ] || continue
                    if [ "$disk" = "dedicated" ]; then
                      # Annotation first: Longhorn acts as soon as it sees the label.
                      kubectl annotate node "$node" --overwrite \
                        node.longhorn.io/default-disks-config='[{"path":"/mnt/longhorn-disk","allowScheduling":true,"storageReserved":0,"tags":["dedicated"]}]'
                      kubectl label node "$node" --overwrite \
                        node.longhorn.io/create-default-disk=config
                    else
                      kubectl label node "$node" --overwrite \
                        node.longhorn.io/create-default-disk=true
                    fi
                  done
