# apps/infrastructure/longhorn/values.yaml

# CRITICAL: Disable pre-upgrade checker for ArgoCD compatibility
# Without this, ArgoCD fails because the job runs before the ServiceAccount exists.
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

# Tolerations for the parts this chart deploys (manager, driver, UI,
# webhooks). The parts Longhorn starts itself (engine image, CSI plugin,
# instance managers) follow defaultSettings.taintToleration below.
global:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# Longhorn Manager DaemonSet
longhornManager:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# Longhorn Driver Deployer
longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# Longhorn UI Deployment (Previously missing)
longhornUI:
  replicas: 2
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# Webhooks (Required for validation/mutation)
longhornConversionWebhook:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

longhornAdmissionWebhook:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

# Default Runtime Settings
defaultSettings:
  # Fixed: Pinning the default engine version natively so Gitops enforces its deployment
  defaultEngineImage: "longhornio/longhorn-engine:v1.9.0"

  defaultReplicaCount: 3
  # Longhorn's own parts run on the control planes too, so they can keep
  # copies of volumes (without this only untainted nodes can).
  taintToleration: "node-role.kubernetes.io/control-plane:NoSchedule;node-role.kubernetes.io/master:NoSchedule"
  # Each copy of a volume on a different node, so losing a node never
  # loses a volume; copies are moved to nodes that join or come back.
  replicaSoftAntiAffinity: false
  replicaAutoBalance: best-effort
  # When a node goes down, Longhorn removes its stuck pods so their apps
  # start on another node with their volumes.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  storageMinimalAvailablePercentage: 10
  # CRITICAL: Prevents Longhorn from using disks on nodes not explicitly labeled
  # You MUST run: kubectl label nodes <node-name> node.longhorn.io/create-default-disk=true
  createDefaultDiskLabeledNodes: true
  # Optional: Improve rebuild speed in homelabs
  fastReplicaRebuildEnabled: true

# Storage Class Configuration
persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
