# Web UI on the LAN: https://wg.<base domain>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wg-easy
  namespace: wg-easy
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - __HOSTNAME__
      secretName: wg-easy-web-ui-tls

  rules:
    - host: __HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wg-easy-web
                port:
                  number: 51821
