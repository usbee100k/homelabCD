apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx-webhook-ca-patch
  namespace: ingress-nginx

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-nginx-webhook-ca-patch
rules:
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    resourceNames:
      - ingress-nginx-admission
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-nginx-webhook-ca-patch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-nginx-webhook-ca-patch
subjects:
  - kind: ServiceAccount
    name: ingress-nginx-webhook-ca-patch
    namespace: ingress-nginx

---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-nginx-webhook-ca-patch
  namespace: ingress-nginx
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: ingress-nginx-webhook-ca-patch
      restartPolicy: Never
      containers:
        - name: patch
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -ec
            - |
              CA="$(kubectl -n ingress-nginx get secret ingress-nginx-admission -o jsonpath='{.data.ca}')"

              if [ -z "$CA" ]; then
                echo "ERROR: ingress-nginx-admission Secret has no CA"
                exit 1
              fi

              kubectl patch validatingwebhookconfiguration ingress-nginx-admission \
                --type=json \
                -p="[{\"op\":\"add\",\"path\":\"/webhooks/0/clientConfig/caBundle\",\"value\":\"${CA}\"}]"

              echo "Webhook CA bundle patched successfully."
